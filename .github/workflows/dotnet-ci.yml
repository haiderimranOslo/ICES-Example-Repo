name: .NET CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore TrainingDemo.sln

      - name: Build
        run: dotnet build TrainingDemo.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TrainingDemo.sln --configuration Release --no-build --logger "console;verbosity=normal"
